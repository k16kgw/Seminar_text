name: Deploy MyST site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# MyST builds a project site served from https://<user>.github.io/<repo>/.
# BASE_URL must be the repository name so that CSS/JS/asset paths resolve.
env:
  BASE_URL: /${{ github.event.repository.name }}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install MyST
        run: |
          npm install -g mystmd@1.9.0

      - name: Check notebooks
        run: |
          python scripts/check_notebooks.py

      - name: Build MyST HTML
        run: |
          myst build --html --ci
          test -f _build/html/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _build/html

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
