<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="410" viewBox="0 0 1000 410" role="img" aria-labelledby="title desc">
  <title id="title">確率的シミュレーションの反復比較</title>
  <desc id="desc">同じ条件を複数seedで実行し，単一結果ではなく分布で基準条件と代替条件を比較する．</desc>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0v6l8-3z" fill="#415d73"/></marker><style>.t{font:20px sans-serif;fill:#20364a}.s{font:16px sans-serif;fill:#52677a}.a{stroke:#415d73;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1000" height="410" fill="#fbfdff"/>
  <text x="500" y="38" text-anchor="middle" style="font:700 26px sans-serif;fill:#173451">1回の動画ではなく，seedを変えた分布を比べる</text>
  <g transform="translate(45 100)"><rect width="190" height="180" rx="16" fill="#eaf4ff" stroke="#3e79ad" stroke-width="2"/><text x="95" y="38" text-anchor="middle" class="t">固定する条件</text><text x="95" y="78" text-anchor="middle" class="s">人数・空間</text><text x="95" y="106" text-anchor="middle" class="s">行動規則</text><text x="95" y="134" text-anchor="middle" class="s">更新方式</text></g>
  <path class="a" d="M240 190H300"/>
  <g transform="translate(310 75)"><rect width="250" height="230" rx="16" fill="#fff5e3" stroke="#bd8425" stroke-width="2"/><text x="125" y="38" text-anchor="middle" class="t">seedだけを変える</text><g class="s"><text x="40" y="82">seed 1 → T₁</text><text x="40" y="116">seed 2 → T₂</text><text x="40" y="150">seed 3 → T₃</text><text x="40" y="184">…</text><text x="40" y="214">seed n → Tₙ</text></g></g>
  <path class="a" d="M565 190H625"/>
  <g transform="translate(635 75)"><rect width="320" height="230" rx="16" fill="#f2edff" stroke="#7959ad" stroke-width="2"/><text x="160" y="38" text-anchor="middle" class="t">分布として比較</text><path d="M45 185H280M45 185V65" stroke="#708597" stroke-width="2"/><g fill="#7b5bad"><rect x="65" y="150" width="25" height="35"/><rect x="95" y="120" width="25" height="65"/><rect x="125" y="80" width="25" height="105"/><rect x="155" y="95" width="25" height="90"/><rect x="185" y="135" width="25" height="50"/><rect x="215" y="160" width="25" height="25"/></g><text x="160" y="218" text-anchor="middle" class="s">平均・中央値・ばらつき・未完了率</text></g>
  <text x="500" y="375" text-anchor="middle" class="t">基準条件と代替条件には同じseed集合を使うと偶然差をそろえやすい</text>
</svg>
