<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" role="img" aria-labelledby="title desc">
  <title id="title">反応と拡散を分けて理解する</title>
  <desc id="desc">各格子点で進む反応と、隣接格子点間をならす拡散が合わさって空間パターンを作る。</desc>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0v6l8-3z" fill="#405c72"/></marker><style>.t{font:20px sans-serif;fill:#1e3549}.s{font:16px sans-serif;fill:#52677b}.p{stroke:#405c72;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1000" height="400" fill="#fbfdff"/>
  <text x="500" y="38" text-anchor="middle" style="font:700 26px sans-serif;fill:#173451">反応拡散 = 各点の反応 + 点どうしの拡散</text>
  <g transform="translate(45 85)">
    <rect width="260" height="220" rx="16" fill="#fff1e6" stroke="#c87832" stroke-width="2"/>
    <text x="130" y="35" text-anchor="middle" class="t">反応だけ</text>
    <g transform="translate(55 65)">
      <circle cx="45" cy="55" r="30" fill="#4a90d9"/><circle cx="115" cy="55" r="22" fill="#e05b66"/>
      <path class="p" d="M73 45H88"/><path class="p" d="M100 80H70"/>
      <text x="45" y="61" text-anchor="middle" fill="white" class="t">u</text><text x="115" y="61" text-anchor="middle" fill="white" class="t">v</text>
    </g>
    <text x="130" y="185" text-anchor="middle" class="s">場所ごとにODEが進む</text>
  </g>
  <text x="340" y="205" text-anchor="middle" style="font:32px sans-serif;fill:#405c72">＋</text>
  <g transform="translate(370 85)">
    <rect width="260" height="220" rx="16" fill="#eaf7ff" stroke="#3d83ae" stroke-width="2"/>
    <text x="130" y="35" text-anchor="middle" class="t">拡散だけ</text>
    <g transform="translate(45 70)">
      <rect x="0" y="0" width="45" height="45" fill="#d8edff" stroke="#6e9cb8"/><rect x="45" y="0" width="45" height="45" fill="#8bc5ed" stroke="#6e9cb8"/><rect x="90" y="0" width="45" height="45" fill="#2879b4" stroke="#6e9cb8"/><rect x="135" y="0" width="45" height="45" fill="#d8edff" stroke="#6e9cb8"/>
      <path class="p" d="M115 70H70"/><path class="p" d="M115 90H155"/>
    </g>
    <text x="130" y="185" text-anchor="middle" class="s">高低差を隣へ伝えてならす</text>
  </g>
  <path class="p" d="M645 195H700"/>
  <g transform="translate(720 85)">
    <rect width="235" height="220" rx="16" fill="#f2ecff" stroke="#7a5ab2" stroke-width="2"/>
    <text x="118" y="35" text-anchor="middle" class="t">組み合わせ</text>
    <g transform="translate(38 60)">
      <rect width="160" height="105" rx="6" fill="#17334c"/>
      <circle cx="30" cy="30" r="11" fill="#ffca63"/><circle cx="72" cy="24" r="8" fill="#ffca63"/><circle cx="118" cy="35" r="13" fill="#ffca63"/><circle cx="48" cy="77" r="14" fill="#ffca63"/><circle cx="105" cy="76" r="9" fill="#ffca63"/><circle cx="145" cy="70" r="7" fill="#ffca63"/>
    </g>
    <text x="118" y="195" text-anchor="middle" class="s">特定の空間スケールが成長</text>
  </g>
  <text x="500" y="365" text-anchor="middle" class="t">式を読むときは、まず片方ずつ切った場合を考える</text>
</svg>
