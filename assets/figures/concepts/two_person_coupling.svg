<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" role="img" aria-labelledby="title desc">
  <title id="title">2人の線形ODEと係数行列</title>
  <desc id="desc">RとJの自己作用と相互作用を矢印で示し，係数行列の各要素に対応させる．</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#415d73"/></marker><style>.t{font:21px sans-serif;fill:#20364a}.s{font:16px sans-serif;fill:#52677a}.a{stroke:#415d73;stroke-width:4;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1000" height="400" fill="#fbfdff"/>
  <text x="500" y="38" text-anchor="middle" style="font:700 26px sans-serif;fill:#173451">行列の行は「どの変化率へ入るか」を表す</text>
  <g transform="translate(55 75)">
    <circle cx="120" cy="140" r="58" fill="#e8f3ff" stroke="#397bb2" stroke-width="3"/><text x="120" y="148" text-anchor="middle" class="t">R(t)</text>
    <circle cx="380" cy="140" r="58" fill="#fff0e8" stroke="#c86b42" stroke-width="3"/><text x="380" y="148" text-anchor="middle" class="t">J(t)</text>
    <path class="a" d="M180 120C245 75 285 75 320 115"/><text x="250" y="78" text-anchor="middle" class="t">c</text>
    <path class="a" d="M320 165C260 215 210 215 180 165"/><text x="250" y="228" text-anchor="middle" class="t">b</text>
    <path class="a" d="M95 82C35 30 35 125 60 140"/><text x="38" y="75" class="t">a</text>
    <path class="a" d="M405 82C465 30 465 125 440 140"/><text x="455" y="75" class="t">d</text>
  </g>
  <g transform="translate(590 90)">
    <rect width="350" height="210" rx="16" fill="#f2f5f8" stroke="#75899a" stroke-width="2"/>
    <text x="175" y="48" text-anchor="middle" class="t">d/dt (R, J)ᵀ = M (R, J)ᵀ</text>
    <text x="175" y="105" text-anchor="middle" style="font:30px serif;fill:#20364a">M = ⎛ a  b ⎞</text>
    <text x="175" y="145" text-anchor="middle" style="font:30px serif;fill:#20364a">    ⎝ c  d ⎠</text>
    <text x="175" y="188" text-anchor="middle" class="s">第1行 → dR/dt　第2行 → dJ/dt</text>
  </g>
  <text x="500" y="365" text-anchor="middle" class="t">符号を1個ずつ見るだけでなく，行列全体の固有値で挙動を判断する</text>
</svg>
